services:
  - type: web
    name: topinvestors-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: topinvestors-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: topinvestors-cache
          property: connectionString
      - key: ADMIN_REFRESH_TOKEN
        generateValue: true
      - key: SEC_USER_AGENT
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: keyvalue
    name: topinvestors-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: topinvestors-db
    plan: free
    databaseName: topinvestors
    user: topinvestors
